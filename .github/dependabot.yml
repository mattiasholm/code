version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directories:
      - /terraform/**
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directories:
      - /pulumi/**
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directories:
      - /**
    schedule:
      interval: monthly
